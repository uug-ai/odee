name: Release

on:
  release:
    types: [created]

permissions:
  contents: read
  packages: write

jobs:
  release:
    uses: uug-ai/workflows/.github/workflows/release-create.yml@main
    with:
      project: ${{ github.event.repository.name }}
      tag: ${{ github.event.release.tag_name }}
      docker_context: "."
      use_private_module_auth: false
      runner_matrix: '[{"architecture":"amd64","runner":"ubuntu-24.04"},{"architecture":"arm64","runner":"ubuntu-24.04-arm"}]'
      create_gitops_pr: false
    secrets: inherit

  verify-release:
    needs: release
    uses: ./.github/workflows/security-scan.yml
    with:
      image_ref: ghcr.io/uug-ai/odee:${{ github.event.release.tag_name }}
